name: colette
description: Suivi des soins du nouveau-né, pour deux parents.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  fpdart: ^1.2.0
  uuid: ^4.6.0
  intl: ^0.20.3
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/splash.png
    - assets/brand/splash_dark.png
    - assets/diversification/
